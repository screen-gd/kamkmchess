name: Go API

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: kha41_test
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: kha41_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kha41_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KHA41_TEST_DATABASE_URL: postgres://kha41_test:fixture-only@127.0.0.1:5432/kha41_test?sslmode=disable
      KHA41_REQUIRE_POSTGRES: '1'
      KHA66_WORKER_ENTRY: ${{ github.workspace }}/build/rules-worker/worker.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:rules-worker
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go vet ./backend/... ./cmd/...
      - run: go test -race -count=1 ./backend/... ./cmd/...
